# nginx หน้าแอป (prod) — security headers แอปตั้งให้แล้ว ไม่ต้องตั้งซ้ำที่นี่
server {
  listen 80;
  server_name _;
  client_max_body_size 1m;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
  proxy_set_header X-Real-IP $remote_addr;
  # ต่อท้าย IP จริงของลูกค้า — แอปตั้ง TRUST_PROXY=1 จึงเชื่อเฉพาะค่าที่ nginx ใส่ (ปลอมจากฝั่งลูกค้าไม่ได้)
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # SSE สถานะออเดอร์: ห้าม buffer และเปิดค้างได้นาน
  location ~ ^/api/orders/[^/]+/events$ {
    proxy_pass http://app:3000;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  # webhook: ส่ง body ต่อแบบไม่แตะ (ลายเซ็น HMAC คิดจาก raw body)
  location = /api/webhooks/payment {
    proxy_pass http://app:3000;
    proxy_request_buffering on;
  }

  # css/js เก็บ cache 7 วัน
  location ~* \.(css|js)$ {
    proxy_pass http://app:3000;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=604800" always;
  }

  location / {
    proxy_pass http://app:3000;
  }
}
