<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koinz — เติมเกมด้วย QR PromptPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Mitr:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/"><span class="coin coin-mini">K</span><span data-shop>Koinz</span></a>
      <nav><a href="#games">เลือกเกม</a><a href="#mine">ออเดอร์ของฉัน</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div>
        <h1>เติมเกมง่าย จ่ายผ่าน QR แล้วเล่นต่อได้เลย</h1>
        <p>กรอก UID เลือกแพ็กเกจ สแกนจ่ายด้วยแอปธนาคารไหนก็ได้ ร้านเติมให้และแจ้งสถานะในหน้าออเดอร์ของคุณ</p>
      </div>
      <div class="stack" aria-hidden="true">
        <span class="coin">฿</span><span class="coin">K</span><span class="coin">฿</span>
      </div>
    </section>

    <section class="section" id="games">
      <h2>เลือกเกมที่จะเติม</h2>
      <div class="games" id="game-list"><p class="empty">กำลังโหลดรายชื่อเกม…</p></div>
    </section>

    <section class="section" id="mine">
      <h2>ออเดอร์ของฉัน</h2>
      <p class="lead">ออเดอร์ที่สั่งจากเครื่องนี้จะแสดงที่นี่</p>
      <div class="my-orders" id="my-orders"></div>
    </section>
  </main>

  <footer><div class="wrap">© <span data-shop>Koinz</span> — ร้านเติมเกมออนไลน์</div></footer>

  <script src="/js/common.js"></script>
  <script>
    api('/api/games')
      .then((games) => {
        $('#game-list').innerHTML = games.length
          ? games.map((g) => `
              <a class="game" href="/game.html?slug=${encodeURIComponent(g.slug)}">
                <span class="icon" style="--c:${esc(g.color)}">${esc(g.icon)}</span>
                <span><strong>${esc(g.name)}</strong><span>${esc(g.currency)} เริ่มต้น ${baht(g.minPrice)}</span></span>
              </a>`).join('')
          : '<p class="empty">ยังไม่มีเกมในร้าน เพิ่มได้ที่หลังบ้าน</p>';
      })
      .catch((e) => ($('#game-list').innerHTML = `<p class="error">${esc(e.message)}</p>`));

    const mine = myOrders.list();
    $('#my-orders').innerHTML = mine.length
      ? mine.map((o) => `
          <a href="/order.html?id=${encodeURIComponent(o.id)}&t=${encodeURIComponent(o.token)}">
            <span>${esc(o.gameName)} · ${esc(o.packageName)}</span><span>${esc(o.id)}</span>
          </a>`).join('')
      : '<p class="empty">ยังไม่มีออเดอร์ เลือกเกมด้านบนเพื่อเริ่มเติม</p>';
  </script>
</body>
</html>
