<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Koinz — เติมเกมด้วย QR PromptPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="./"><span data-shop>Koinz</span></a>
      <nav class="navlinks" aria-label="เมนูหลัก">
        <a class="desk first" href="#games">เกมทั้งหมด</a>
        <a href="#mine">ออเดอร์ของฉัน</a>
        <a class="desk" id="contact" href="#" hidden>ติดต่อร้าน</a>
        <a id="member-link" href="login.html">เข้าสู่ระบบ</a>
      </nav>
    </header>

    <main class="shop" id="shop">
      <nav class="chips" id="games" aria-label="เลือกเกม"><p class="empty">กำลังโหลดรายชื่อเกม…</p></nav>

      <section class="stage" aria-label="กองเหรียญตามแพ็กเกจที่เลือก">
        <svg class="pile" id="pile" viewBox="-96 -112 192 212"></svg>
        <span class="hintpill">แพ็กใหญ่ขึ้น กองเหรียญก็สูงขึ้น</span>
      </section>

      <div class="shop-head">
        <p class="eyebrow">จ่ายผ่าน QR PromptPay ได้ทุกธนาคาร</p>
        <h1 id="title">เติมเกม</h1>
      </div>

      <section class="packs-wrap" aria-labelledby="packs-title">
        <h2 class="packs-title" id="packs-title">เลือกแพ็กเกจ</h2>
        <div class="packs" id="packs" role="radiogroup" aria-labelledby="packs-title"></div>
      </section>

      <form class="checkout" id="checkout" novalidate hidden>
        <div class="co-sum" aria-live="polite">
          <span class="co-summary" id="summary"></span>
          <span class="co-total" id="total">฿0</span>
        </div>
        <div class="co-fields" id="fields"></div>
        <div class="co-help" id="help"></div>
        <div class="co-pay">
          <button class="btn btn-red" type="submit">ไปชำระเงิน <span id="arrow-d"></span></button>
        </div>
      </form>

      <section class="mine" id="mine" aria-labelledby="mine-title">
        <h2 id="mine-title">ออเดอร์ของฉัน</h2>
        <div class="mine-list" id="mine-list"></div>
      </section>
    </main>

    <footer class="site-foot">
      <span>สแกนจ่ายด้วยแอปธนาคารไหนก็ได้</span>
      <span>ติดตามสถานะออเดอร์ได้ตลอดจากลิงก์ของคุณ</span>
      <span>ติดต่อร้านทาง LINE ได้ถ้ามีปัญหา</span>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pile.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
