<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Koinz — เติมเกมด้วย QR PromptPay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="logo" href="./"><span data-shop>Koinz</span></a>
      <nav class="navlinks" aria-label="เมนูหลัก">
        <a class="desk first" href="#games">เกมทั้งหมด</a>
        <a href="#mine">ออเดอร์ของฉัน</a>
        <a class="desk" id="contact" href="#" hidden>ติดต่อร้าน</a>
      </nav>
    </header>

    <main class="shop" id="shop">
      <nav class="chips" id="games" aria-label="เลือกเกม"><p class="empty">กำลังโหลดรายชื่อเกม…</p></nav>

      <section class="stage" aria-label="กองเหรียญตามแพ็กเกจที่เลือก">
        <svg class="pile" id="pile" viewBox="-96 -112 192 212"></svg>
        <span class="hintpill">แพ็กใหญ่ขึ้น กองเหรียญก็สูงขึ้น</span>
      </section>

      <div class="shop-head">
        <p class="eyebrow">จ่ายผ่าน QR PromptPay ได้ทุกธนาคาร</p>
        <h1 id="title">เติมเกม</h1>
      </div>

      <section class="packs-wrap" aria-labelledby="packs-title">
        <h2 class="packs-title" id="packs-title">เลือกแพ็กเกจ</h2>
        <div class="packs" id="packs" role="radiogroup" aria-labelledby="packs-title"></div>
      </section>

      <form class="checkout" id="checkout" novalidate hidden>
        <div class="co-sum" aria-live="polite">
          <span class="co-summary" id="summary"></span>
          <span class="co-total" id="total">฿0</span>
        </div>
        <div class="co-fields" id="fields"></div>
        <div class="co-help" id="help"></div>
        <div class="co-pay">
          <button class="btn btn-red" type="submit">ไปชำระเงิน <span id="arrow-d"></span></button>
        </div>
      </form>

      <section class="mine" id="mine" aria-labelledby="mine-title">
        <h2 id="mine-title">ออเดอร์ของฉัน</h2>
        <div class="mine-list" id="mine-list"></div>
      </section>
    </main>

    <footer class="site-foot">
      <span>สแกนจ่ายด้วยแอปธนาคารไหนก็ได้</span>
      <span>ติดตามสถานะออเดอร์ได้ตลอดจากลิงก์ของคุณ</span>
      <span>ติดต่อร้านทาง LINE ได้ถ้ามีปัญหา</span>
    </footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pile.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const fullGames = new Map(); // slug -> เกมพร้อมแพ็กเกจและ fields
    let games = [], game = null, selected = null, cfg = {};
    let idemKey = null;          // ใช้ซ้ำเมื่อกดจ่ายใหม่หลังเน็ตหลุด ล้างเมื่อแก้ข้อมูล
    let nickname = null;         // ผลตรวจชื่อในเกม { nickname, mock }
    let rememberedUsed = false;  // กรอก UID ล่าสุดให้อัตโนมัติ

    const fieldId = (f) => 'f-' + f.name;

    // ---------- ชิปเลือกเกม ----------
    function renderChips() {
      $('#games').innerHTML = games.map((g) => `
        <button type="button" class="chip" data-slug="${esc(g.slug)}" aria-pressed="${g.slug === (game && game.slug)}">
          <span class="ini" style="--c:${esc(g.color)}" aria-hidden="true">${esc(g.initial)}</span>${esc(g.name)}
        </button>`).join('');
      document.querySelectorAll('.chip').forEach((b) => b.addEventListener('click', () => selectGame(b.dataset.slug, true)));
    }

    async function selectGame(slug, userAction) {
      try {
        if (!fullGames.has(slug)) fullGames.set(slug, await api('/api/games/' + encodeURIComponent(slug)));
      } catch (e) {
        $('#packs').innerHTML = `<p class="error" role="alert">${esc(e.message)}</p>`;
        return;
      }
      game = fullGames.get(slug);
      selected = game.packages.find((p) => p.tag) || game.packages[0] || null;
      idemKey = null;
      nickname = null;
      if (userAction) history.replaceState(null, '', '?game=' + encodeURIComponent(slug) + location.hash);
      document.querySelectorAll('.chip').forEach((b) => b.setAttribute('aria-pressed', b.dataset.slug === slug));
      // มือถือ: เลื่อนแถวชิปให้เห็นเกมที่เลือก (เลื่อนเฉพาะแนวนอน ไม่เลื่อนทั้งหน้า)
      const chip = document.querySelector(`.chip[aria-pressed="true"]`);
      const row = $('#games');
      if (chip && row.scrollWidth > row.clientWidth) {
        const left = chip.offsetLeft - row.offsetLeft;
        if (left < row.scrollLeft || left + chip.offsetWidth > row.scrollLeft + row.clientWidth) {
          row.scrollTo({ left: left - 22, behavior: userAction ? 'smooth' : 'auto' });
        }
      }
      renderGame();
    }

    // ---------- เกมที่เลือก ----------
    function renderGame() {
      document.title = `เติม ${game.name} — Koinz`;
      $('#title').textContent = `เติม ${game.name}`;
      // หน่วยภาษาอังกฤษ (เช่น Genesis Crystals) เว้นวรรคให้อ่านง่าย
      const unit = game.currency || 'แพ็กเกจ';
      $('#packs-title').textContent = `เลือกจำนวน${/^[A-Za-z0-9]/.test(unit) ? ' ' : ''}${unit}`;
      $('#packs').innerHTML = game.packages.map((p) => `
        <button type="button" class="pack" role="radio" aria-checked="${p === selected}" data-id="${esc(p.id)}">
          <span class="pk-name">${esc(p.name)}</span>
          <span class="pk-price">${baht(p.price)}</span>
          ${p.tag ? `<span class="pk-tag">${esc(p.tag)}</span>` : ''}
        </button>`).join('') || '<p class="empty">เกมนี้ยังไม่มีแพ็กเกจ</p>';
      document.querySelectorAll('.pack').forEach((b) => b.addEventListener('click', () => selectPack(b.dataset.id)));
      renderFields();
      updateSelection();
    }

    function selectPack(id) {
      selected = game.packages.find((p) => p.id === id);
      idemKey = null;
      document.querySelectorAll('.pack').forEach((b) => b.setAttribute('aria-checked', b.dataset.id === id));
      updateSelection();
    }

    function updateSelection() {
      const label = selected ? selected.name : '';
      renderPile($('#pile'), selected ? pileLevel(game.packages, selected.id) : 1, label);
      $('#summary').textContent = selected ? `${selected.name} · ${game.name}` : 'ยังไม่ได้เลือกแพ็กเกจ';
      $('#total').textContent = baht(selected ? selected.price : 0);
    }

    // ---------- ช่องข้อมูลผู้เล่น ----------
    function controlHtml(f, value, withIcon) {
      const id = esc(fieldId(f));
      if (f.options) {
        return `<select id="${id}" name="${esc(f.name)}">
            <option value="">เลือก</option>
            ${f.options.map((o) => `<option ${o === value ? 'selected' : ''}>${esc(o)}</option>`).join('')}
          </select><span class="chev">${ICON.chevron}</span>`;
      }
      return `${withIcon ? ICON.user : ''}<input id="${id}" name="${esc(f.name)}" value="${esc(value || '')}" autocomplete="off"
          maxlength="64" inputmode="${esc(f.inputmode || 'text')}" placeholder="${esc(f.placeholder || f.label)}"
          ${f.required ? 'required' : ''} aria-describedby="co-err">`;
    }

    function renderFields() {
      const saved = remember.get(game.slug, game.fields);
      rememberedUsed = Object.keys(saved).length > 0;
      const multi = game.fields.length > 1;
      const box = $('#fields');
      box.className = 'co-fields' + (multi ? ' multi' : '') + (game.fields.length > 2 ? ' many' : '');
      box.innerHTML = game.fields.map((f) => multi || f.options
        ? `<div class="field"><div class="capsule stacked" data-field="${esc(f.name)}">
             <label class="mini" for="${esc(fieldId(f))}">${esc(f.label)}${f.required ? '' : ' (ไม่บังคับ)'}</label>
             ${controlHtml(f, saved[f.name], false)}
           </div></div>`
        : `<div class="field">
             <label class="field-label" for="${esc(fieldId(f))}">${esc(f.label)}</label>
             <div class="capsule" data-field="${esc(f.name)}">${controlHtml(f, saved[f.name], true)}</div>
           </div>`).join('') +
        `<button type="submit" class="go-round" aria-label="ไปหน้าชำระเงิน">${ICON.arrow()}</button>`;

      for (const f of game.fields) {
        const el = $('#' + fieldId(f));
        el.addEventListener(f.options ? 'change' : 'input', () => {
          idemKey = null;
          rememberedUsed = false;
          el.closest('.capsule').classList.remove('invalid');
          if (nickname) { nickname = null; renderHelp(); }
          else { $('#co-err').textContent = ''; renderHint(); }
        });
        if (f.pattern) el.addEventListener('blur', () => {
          const v = el.value.trim();
          const bad = v && !new RegExp(f.pattern).test(v);
          el.closest('.capsule').classList.toggle('invalid', !!bad);
          $('#co-err').textContent = bad ? (f.patternHint || `${f.label}ไม่ถูกต้อง`) : '';
        });
      }
      $('#checkout').hidden = false;
      renderHelp();
    }

    // แถวช่วยเหลือใต้ช่อง: ปุ่มตรวจชื่อ / ป้ายชื่อในเกม + คำใบ้ + ข้อความผิดพลาด
    function renderHelp() {
      const help = $('#help');
      let lookup = '';
      if (cfg.lookupEnabled) {
        lookup = nickname
          ? `<span class="okbadge" role="status">${ICON.check(16, 2.4)}ชื่อในเกม: <span id="nick-text"></span></span>
             <button type="button" class="btn-link" id="not-me">ไม่ใช่บัญชีนี้</button>`
          : `<button type="button" class="btn-mini" id="lookup">${ICON.search()}ตรวจสอบชื่อในเกม</button>`;
      }
      help.innerHTML = `${lookup}<span id="hint"></span><p class="error" id="co-err" role="alert"></p>`;
      if (nickname) $('#nick-text').textContent = nickname.nickname + (nickname.mock ? ' (ชื่อจำลองสำหรับทดสอบ)' : '');
      renderHint();
      const lb = $('#lookup');
      if (lb) lb.addEventListener('click', doLookup);
      const nm = $('#not-me');
      if (nm) nm.addEventListener('click', () => {
        nickname = null;
        renderHelp();
        $('#' + fieldId(game.fields[0])).focus();
      });
    }

    function renderHint() {
      const hint = $('#hint');
      if (!hint) return;
      const first = game.fields[0] || {};
      const base = first.hint || first.patternHint || '';
      hint.textContent = nickname ? '' : (rememberedUsed ? `ใช้ UID ล่าสุดของเกมนี้ให้แล้ว${base ? ' · ' + base : ''}` : base);
    }

    // ตรวจฝั่ง client แบบเดียวกับเซิร์ฟเวอร์ → { inputs } หรือ { error, field }
    function readInputs() {
      const inputs = {};
      for (const f of game.fields) {
        const v = $('#' + fieldId(f)).value.trim();
        if (!v) {
          if (f.required) return { error: `${f.options ? 'กรุณาเลือก' : 'กรุณากรอก'}${f.label}`, field: f };
          continue;
        }
        if (/[<>"'`]/.test(v)) return { error: `${f.label}มีอักขระที่ใช้ไม่ได้`, field: f };
        if (f.pattern && !new RegExp(f.pattern).test(v)) return { error: f.patternHint || `${f.label}ไม่ถูกต้อง`, field: f };
        inputs[f.name] = v;
      }
      return { inputs };
    }

    function showFieldError(error, field) {
      $('#co-err').textContent = error;
      if (field) {
        const el = $('#' + fieldId(field));
        el.closest('.capsule').classList.add('invalid');
        el.focus();
      }
    }

    async function doLookup() {
      const { inputs, error, field } = readInputs();
      if (error) return showFieldError(error, field);
      const btn = $('#lookup');
      btn.disabled = true;
      btn.lastChild.textContent = 'กำลังตรวจสอบ…';
      try {
        nickname = await api('/api/player/lookup', { method: 'POST', body: { gameSlug: game.slug, playerInputs: inputs } });
        renderHelp();
      } catch (ex) {
        btn.disabled = false;
        btn.lastChild.textContent = 'ตรวจสอบชื่อในเกม';
        $('#co-err').textContent = ex.message;
      }
    }

    $('#checkout').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('#co-err').textContent = '';
      if (!selected) return ($('#co-err').textContent = 'เลือกแพ็กเกจก่อน');
      const { inputs, error, field } = readInputs();
      if (error) return showFieldError(error, field);

      idemKey = idemKey || uuid();
      const buttons = document.querySelectorAll('#checkout [type=submit]');
      buttons.forEach((b) => (b.disabled = true));
      try {
        const { id, token } = await api('/api/orders', {
          method: 'POST',
          body: { gameSlug: game.slug, packageId: selected.id, playerInputs: inputs, idempotencyKey: idemKey },
        });
        remember.set(game.slug, game.fields, inputs);
        myOrders.add({ id, token, gameName: game.name, packageName: selected.name, gameSlug: game.slug });
        location.href = `order.html?id=${encodeURIComponent(id)}&t=${encodeURIComponent(token)}`;
      } catch (ex) {
        $('#co-err').textContent = ex.message;
        buttons.forEach((b) => (b.disabled = false));
      }
    });

    // ---------- ออเดอร์ของฉัน ----------
    function renderMine() {
      const mine = myOrders.list();
      $('#mine-list').innerHTML = mine.length
        ? mine.map((o) => `
            <a href="order.html?id=${encodeURIComponent(o.id)}&t=${encodeURIComponent(o.token)}">
              <span>${esc(o.gameName)} · ${esc(o.packageName)}<small>${esc(o.id)}</small></span>${ICON.next}
            </a>`).join('')
        : '<p class="empty">ยังไม่มีออเดอร์จากเครื่องนี้</p>';
    }

    // ---------- เริ่ม ----------
    $('#arrow-d').outerHTML = ICON.arrow(18);
    renderMine();
    Promise.all([api('/api/games'), shopConfig])
      .then(([list, c]) => {
        cfg = c || {};
        games = list;
        if (/^https?:\/\//.test(cfg.shopLineUrl || '')) {
          $('#contact').href = cfg.shopLineUrl;
          $('#contact').hidden = false;
        }
        if (!games.length) {
          $('#games').innerHTML = '<p class="empty">ยังไม่มีเกมในร้าน เพิ่มได้ที่หลังบ้าน</p>';
          return;
        }
        const want = params.get('game') || remember.lastGame();
        const slug = games.some((g) => g.slug === want) ? want : games[0].slug;
        game = { slug };
        renderChips();
        return selectGame(slug, false);
      })
      .catch((e) => ($('#games').innerHTML = `<p class="error" role="alert">${esc(e.message)}</p>`));
  </script>
</body>
</html>
