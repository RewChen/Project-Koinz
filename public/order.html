<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>ออเดอร์ — Koinz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="wrap"><p class="empty" style="padding:40px 0">กำลังโหลดออเดอร์…</p></div>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script src="js/pile.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const t = params.get('t');
    const query = `?t=${encodeURIComponent(t || '')}`;
    const FINAL = ['completed', 'cancelled', 'refunded'];
    const HEADLINE = {
      paid_pending_review: 'ได้รับแจ้งโอนแล้ว',
      paid: 'ยืนยันยอดแล้ว',
      processing: 'กำลังเติมเข้าเกม',
      completed: 'เติมสำเร็จแล้ว',
      cancelled: 'ออเดอร์ถูกยกเลิก',
    };
    let cfg = {}, game = null, timer, tick, clockOffset = 0, lastKey, currentStatus, live;

    const lineUrl = () => (/^https?:\/\//.test(cfg.shopLineUrl || '') ? cfg.shopLineUrl : '');
    const againHref = (o) => './?game=' + encodeURIComponent(o.gameSlug);
    const ref = (o) => `<span class="order-ref">ออเดอร์ ${esc(o.id)}</span>`;
    const logo = '<a class="logo" href="./"><span data-shop>Koinz</span></a>';
    const backBtn = (o) => `<a class="back-round" href="${againHref(o)}" aria-label="กลับไปเลือกแพ็กเกจ">${ICON.back()}</a>`;
    const nickHtml = (o) => (o.playerNickname ? `<span class="nick">✓ ชื่อในเกม: ${esc(o.playerNickname)}</span>` : '');
    const historyAt = (o, statuses) => (o.history || []).find((h) => statuses.includes(h.status));

    function view(o) {
      if (o.status === 'pending_payment' && o.qr) return 'pay';
      if (o.status === 'pending_payment' || o.status === 'expired') return 'expired';
      if (o.status === 'refund_needed' || o.status === 'refunded') return 'refund';
      return 'status';
    }

    // ---------- หน้าจ่าย ----------
    function payHtml(o) {
      const amount = baht(o.amount);
      const qrAlt = `QR PromptPay ยอด ${amount}`;
      const save = `download="koinz-${esc(o.id)}.png" href="${esc(o.qr)}"`;
      const timerHtml = (prefix) => `
        <div class="timer">${ICON.clock(14)}<span aria-hidden="true">${prefix} <span class="left">–</span></span>
          <span class="sr-only left-sr" aria-live="polite"></span></div>`;
      return `
        <div class="screen pay-m">
          <header class="o-top">${backBtn(o)}${ref(o)}</header>
          <section class="pay-title">
            <div><h1>สแกนจ่ายผ่าน PromptPay</h1><p class="amount">${amount}</p></div>
            ${timerHtml('เหลือ')}
          </section>
          <section class="qr-card"><img src="${esc(o.qr)}" alt="${esc(qrAlt)}"><p>${esc(o.promptPayName)} · PromptPay</p></section>
          <section class="uid-card">
            <div><small>เติมเข้า UID · ${esc(o.gameName)}</small><p class="uid-big">${esc(playerText(o))}</p>${nickHtml(o)}</div>
            <p class="pk">${esc(o.packageName)}</p>
          </section>
          <div class="spacer"></div>
          <section class="o-actions">
            <label class="capsule"><span class="lbl">LINE ID</span>
              <input class="line-in" maxlength="50" autocomplete="off" placeholder="ไม่บังคับ · ให้ร้านติดต่อกลับถ้ามีปัญหา"></label>
            <a class="btn btn-ink" ${save}>${ICON.download}บันทึก QR ลงเครื่อง</a>
            <button type="button" class="btn btn-red notify">ฉันโอนเงินแล้ว</button>
            <p class="error err" role="alert"></p>
            <p class="o-note">บันทึก QR แล้วเปิดในแอปธนาคาร &gt; สแกนจากรูปภาพ</p>
          </section>
        </div>

        <div class="pay-d">
          <header class="top">${logo}${ref(o)}</header>
          <a class="back-link" href="${againHref(o)}">${ICON.back(16)}แก้แพ็กเกจหรือ UID</a>
          <main class="pay-d-main">
            <section class="qr-panel" aria-label="QR สำหรับชำระเงิน">
              <img src="${esc(o.qr)}" alt="${esc(qrAlt)}">
              <div class="qr-info">
                <div><p class="lead">ยอดชำระ</p><p class="amount">${amount}</p><p class="sub">${esc(o.promptPayName)} · PromptPay</p></div>
                ${timerHtml('QR ใช้ได้อีก')}
                <a class="btn-link" ${save} style="display:inline-flex;align-items:center">จ่ายจากมือถือเครื่องอื่น? บันทึก QR เป็นรูป</a>
              </div>
              <ol class="steps-pay">
                <li><span class="num">1</span>เปิดแอปธนาคารในมือถือ</li>
                <li><span class="num">2</span>สแกน QR บนจอนี้ ตรวจยอด ${amount}</li>
                <li><span class="num">3</span>โอนเสร็จแล้วกด "ฉันโอนเงินแล้ว"</li>
              </ol>
            </section>
            <section class="o-side" aria-label="สรุปออเดอร์">
              <div class="uid-panel">
                <small>เติมเข้า UID · ตรวจให้ถูกก่อนโอน</small>
                <p class="uid-big">${esc(playerText(o))}</p>${nickHtml(o)}
                <div class="kv"><span>เกม</span><span>${esc(o.gameName)}</span></div>
                <div class="kv"><span>แพ็กเกจ</span><span>${esc(o.packageName)}</span></div>
              </div>
              <div>
                <label class="big" for="line-d">LINE ID <span>(ไม่บังคับ)</span></label>
                <input id="line-d" class="input-plain line-in" maxlength="50" autocomplete="off" placeholder="ให้ร้านติดต่อกลับถ้ามีปัญหา">
              </div>
              <button type="button" class="btn btn-red notify">ฉันโอนเงินแล้ว</button>
              <p class="error err" role="alert"></p>
              <p class="o-note">ร้านตรวจยอดแล้วเติมให้ ติดตามสถานะได้จากลิงก์ออเดอร์นี้</p>
            </section>
          </main>
        </div>`;
    }

    function startCountdown(o) {
      clearInterval(tick);
      if (!o.expiresAt) return;
      const end = Date.parse(o.expiresAt);
      let lastMinute = -1;
      const show = () => {
        const left = Math.max(0, Math.round((end - (Date.now() + clockOffset)) / 1000));
        const text = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, '0')}`;
        document.querySelectorAll('.left').forEach((el) => (el.textContent = text));
        // ผู้ใช้โปรแกรมอ่านหน้าจอ: แจ้งทุกนาที ไม่ใช่ทุกวินาที
        const minute = Math.ceil(left / 60);
        if (minute !== lastMinute) {
          lastMinute = minute;
          document.querySelectorAll('.left-sr').forEach((el) => (el.textContent = left > 0 ? `QR ใช้ได้อีกประมาณ ${minute} นาที` : 'QR หมดอายุแล้ว'));
        }
        if (left <= 0) { clearInterval(tick); setTimeout(load, 1500); }
      };
      show();
      tick = setInterval(show, 1000);
    }

    function bindPay() {
      // ช่อง LINE มี 2 ช่อง (มือถือ/คอม) ให้ค่าตรงกันเสมอ
      const lines = [...document.querySelectorAll('.line-in')];
      lines.forEach((el) => el.addEventListener('input', () => lines.forEach((x) => x !== el && (x.value = el.value))));
      document.querySelectorAll('.notify').forEach((btn) => btn.addEventListener('click', () => notify(btn, { lineId: lines[0].value })));
    }

    async function notify(btn, extra = {}) {
      const label = btn.textContent;
      const err = btn.parentElement.querySelector('.err');
      btn.disabled = true;
      btn.textContent = 'กำลังแจ้งร้าน…';
      try {
        await api(`/api/orders/${encodeURIComponent(id)}/notify`, { method: 'POST', body: { t, ...extra } });
        await load();
      } catch (e) {
        if (err) err.textContent = e.message;
        btn.disabled = false;
        btn.textContent = label;
      }
    }

    // ---------- QR หมดอายุ ----------
    function ghostQr() {
      // ลาย QR จาง ๆ สำหรับตกแต่ง (ไม่ใช่ QR จริง)
      const N = 25, rects = [];
      const inF = (x, y, ox, oy) => {
        const dx = x - ox, dy = y - oy;
        if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return null;
        return dx === 0 || dy === 0 || dx === 6 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
      };
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
        let on = inF(x, y, 0, 0);
        if (on === null) on = inF(x, y, N - 7, 0);
        if (on === null) on = inF(x, y, 0, N - 7);
        if (on === null) on = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9) ? false : ((x * 7 + y * 13) ^ (x * y + 5)) % 5 < 2;
        if (on) rects.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`);
      }
      return `<svg class="ghost" viewBox="0 0 25 25" width="168" height="168" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">${rects.join('')}</svg>`;
    }

    function expiredHtml(o) {
      return `
        <div class="screen narrow">
          <header class="o-top">${backBtn(o)}${ref(o)}</header>
          <section class="expired-card">
            <div class="expired-art">${ghostQr()}<div class="clock"><span>${ICON.stopwatch}</span></div></div>
            <div><h1>QR หมดอายุแล้ว</h1><p>ร้านยังไม่ได้รับเงินของออเดอร์นี้<br>สร้างออเดอร์ใหม่เพื่อรับ QR อันใหม่ได้เลย</p></div>
          </section>
          <section class="sum-card">
            <div><small>${esc(o.gameName)} · ${esc(o.packageName)}</small><b>${esc(playerText(o))}</b></div>
            <b>${baht(o.amount)}</b>
          </section>
          <div class="spacer"></div>
          <section class="o-bottom">
            <button type="button" class="btn btn-red" id="reorder">สร้างออเดอร์ใหม่ ${baht(o.amount)}</button>
            <button type="button" class="btn btn-white" id="claim">ฉันโอนไปแล้วก่อนหมดเวลา</button>
            <p class="error err" role="alert"></p>
            <p class="o-note">ออเดอร์ใหม่ใช้ UID และแพ็กเกจเดิมให้อัตโนมัติ</p>
          </section>
        </div>`;
    }

    function bindExpired(o) {
      $('#claim').addEventListener('click', () => notify($('#claim')));
      $('#reorder').addEventListener('click', async () => {
        const btn = $('#reorder');
        btn.disabled = true;
        try {
          const r = await api('/api/orders', {
            method: 'POST',
            body: { gameSlug: o.gameSlug, packageId: o.packageId, playerInputs: o.playerInputs, idempotencyKey: uuid() },
          });
          myOrders.add({ id: r.id, token: r.token, gameName: o.gameName, packageName: o.packageName, gameSlug: o.gameSlug });
          location.href = `order.html?id=${encodeURIComponent(r.id)}&t=${encodeURIComponent(r.token)}`;
        } catch (e) {
          btn.parentElement.querySelector('.err').textContent = `${e.message} — เลือกแพ็กเกจใหม่ได้ที่หน้าแรก`;
          btn.disabled = false;
        }
      });
    }

    // ---------- สถานะ ----------
    function stepRow({ label, time, state, current }) {
      const icon = state === 'done' ? ICON.check() : state === 'bad' ? ICON.cross : '';
      const sr = state === 'done' ? 'ผ่านแล้ว' : state === 'bad' ? 'ไม่สำเร็จ' : 'ยังไม่ถึง';
      return `<li class="${state}${current ? ' current' : ''}"><span class="dot" aria-hidden="true">${icon}</span>
        <span class="lbl">${label}<span class="sr-only"> (${sr})</span></span>${time ? `<time datetime="${esc(time)}">${clockTime(time)}</time>` : ''}</li>`;
    }

    function statusSteps(o) {
      const done = (statuses) => historyAt(o, statuses);
      const s2 = done(['paid_pending_review', 'paid', 'processing', 'completed']);
      const s3 = done(['processing', 'completed']);
      const s4 = done(['completed']);
      const rows = [
        { label: 'สร้างออเดอร์', time: o.createdAt, state: 'done' },
        { label: 'แจ้งโอนแล้ว', time: (done(['paid_pending_review', 'paid']) || s2 || {}).at, state: s2 ? 'done' : 'todo' },
        { label: 'ร้านกำลังเติม', time: (done(['processing']) || {}).at, state: s3 ? 'done' : 'todo' },
        { label: 'เติมสำเร็จ', time: s4 && s4.at, state: s4 ? 'done' : 'todo' },
      ];
      const last = rows.map((r) => r.state).lastIndexOf('done');
      rows[last].current = true;
      return rows.map(stepRow).join('');
    }

    function statusHtml(o) {
      const line = lineUrl();
      return `
        <div class="screen narrow">
          <header class="o-top plain">${logo}${ref(o)}</header>
          <section class="status-hero">
            <svg class="pile" id="pile" viewBox="-96 -112 192 212"></svg>
            <h1>${HEADLINE[o.status] || esc(STATUS[o.status] || o.status)}</h1>
            <p>${esc(o.packageName)} · ${esc(o.gameName)} · UID ${esc(playerText(o))}</p>
            ${nickHtml(o)}
          </section>
          <section class="timeline-card" aria-label="ขั้นตอนออเดอร์"><ol class="timeline">${statusSteps(o)}</ol></section>
          <div class="spacer"></div>
          <section class="o-bottom">
            <p class="o-note">${FINAL.includes(o.status) ? 'ขอบคุณที่ใช้บริการ' : 'หน้านี้อัปเดตเอง ไม่ต้องรีเฟรช'}</p>
            <a class="btn btn-red" href="${againHref(o)}">เติมเกมอีกครั้ง</a>
            ${line ? `<a class="btn btn-white" href="${esc(line)}" target="_blank" rel="noopener">ติดต่อร้านทาง LINE</a>` : ''}
          </section>
        </div>`;
    }

    // ---------- เติมไม่สำเร็จ / คืนเงิน ----------
    function refundHtml(o) {
      const refunded = o.status === 'refunded';
      const line = lineUrl();
      const amount = baht(o.amount);
      const fail = historyAt(o, ['refund_needed']);
      const steps = [
        { label: 'สร้างออเดอร์', time: o.createdAt, state: 'done' },
        { label: 'ยืนยันยอดแล้ว', time: (historyAt(o, ['paid']) || {}).at, state: 'done' },
        { label: 'เติมเข้าเกมไม่สำเร็จ', time: fail && fail.at, state: 'bad' },
        refunded
          ? { label: 'คืนเงินแล้ว', time: (historyAt(o, ['refunded']) || {}).at, state: 'done', current: true }
          : { label: 'รอร้านคืนเงิน', state: 'todo' },
      ];
      const again = `<a class="btn ${line ? 'btn-white' : 'btn-red'}" href="${againHref(o)}">เติมเกมอีกครั้ง</a>`;
      return `
        <div class="screen narrow">
          <header class="o-top plain">${logo}${ref(o)}</header>
          <section class="refund-hero">
            <div class="refund-icon ${refunded ? 'ok' : ''}">${refunded ? ICON.check(38, 2.2) : ICON.retry}</div>
            <h1>${refunded ? 'คืนเงินเรียบร้อยแล้ว' : 'เติมเข้าเกมไม่สำเร็จ'}</h1>
            <p>${refunded
              ? `ร้านคืนเงิน ${amount} ให้แล้ว\nตรวจยอดได้ในแอปธนาคารของคุณ`
              : `ร้านได้รับเงินแล้ว แต่ระบบเติมเข้าเกมไม่ได้\nร้านจะติดต่อกลับเพื่อคืนเงิน ${amount} ให้ครบ`}</p>
          </section>
          <section class="info-card">
            <div class="kv"><span>รายการ</span><span>${esc(o.gameName)} · ${esc(o.packageName)}</span></div>
            <div class="kv"><span>ผู้เล่น</span><span>${esc(playerText(o))}</span></div>
            <div class="kv"><span>ยอดที่จ่าย</span><span><b>${amount}</b></span></div>
          </section>
          <section class="timeline-card" aria-label="ขั้นตอนออเดอร์"><ol class="timeline">${steps.map(stepRow).join('')}</ol></section>
          <div class="spacer"></div>
          <section class="o-bottom">
            ${line ? `<a class="btn btn-red" href="${esc(line)}" target="_blank" rel="noopener">ติดต่อร้านทาง LINE</a>` : ''}
            ${again}
          </section>
        </div>`;
    }

    // ---------- วาดหน้า ----------
    function render(o) {
      const v = view(o);
      clearInterval(tick);
      document.title = `ออเดอร์ ${o.id} — Koinz`;
      if (v === 'pay') {
        $('#app').innerHTML = payHtml(o);
        bindPay();
        startCountdown(o);
      } else if (v === 'expired') {
        $('#app').innerHTML = expiredHtml(o);
        bindExpired(o);
      } else if (v === 'refund') {
        $('#app').innerHTML = refundHtml(o);
      } else {
        $('#app').innerHTML = statusHtml(o);
        const level = game ? pileLevel(game.packages, o.packageId) : 4;
        renderPile($('#pile'), level, o.packageName);
      }
      if (cfg.shopName) document.querySelectorAll('[data-shop]').forEach((el) => (el.textContent = cfg.shopName));
    }

    async function load() {
      try {
        const o = await api(`/api/orders/${encodeURIComponent(id)}${query}`);
        cfg = await shopConfig;
        if (!game) game = await api('/api/games/' + encodeURIComponent(o.gameSlug)).catch(() => ({ packages: [] }));
        currentStatus = o.status;
        if (o.serverTime) clockOffset = Date.parse(o.serverTime) - Date.now();
        // วาดใหม่เมื่อสถานะเปลี่ยนเท่านั้น (กันช่อง LINE ที่กำลังพิมพ์หาย)
        const key = o.status + (o.qr ? ':qr' : '');
        if (key !== lastKey) { lastKey = key; render(o); }
        if (FINAL.includes(o.status)) stopUpdates();
        return o;
      } catch (e) {
        stopUpdates();
        $('#app').innerHTML = `
          <div class="screen narrow"><header class="o-top plain">${logo}</header>
            <p class="error" role="alert" style="margin-top:24px">${esc(e.message)}</p>
            <p style="margin-top:12px"><a href="./">กลับหน้าแรก</a></p></div>`;
      }
    }

    function stopUpdates() {
      if (live) { live.close(); live = null; }
      clearInterval(timer);
    }

    // อัปเดตแบบ real-time ด้วย SSE ถ้าหลุดค่อยถอยไป poll ทุก 10 วินาที
    function startUpdates() {
      if (!window.EventSource) return (timer = setInterval(load, 10000));
      live = new EventSource(apiUrl(`/api/orders/${encodeURIComponent(id)}/events${query}`));
      live.addEventListener('status', (e) => {
        const { status } = JSON.parse(e.data);
        if (status !== currentStatus) load();
      });
      live.onerror = () => {
        stopUpdates();
        load();
        timer = setInterval(load, 10000);
      };
    }

    load().then((o) => { if (o && !FINAL.includes(o.status)) startUpdates(); });
  </script>
</body>
</html>
