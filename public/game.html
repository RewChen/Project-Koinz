<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เติมเกม — Koinz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Mitr:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="/"><span class="coin coin-mini">K</span><span data-shop>Koinz</span></a>
      <nav><a href="/#games">เกมทั้งหมด</a><a href="/#mine">ออเดอร์ของฉัน</a></nav>
    </div>
  </header>

  <main class="wrap" id="app"><p class="empty">กำลังโหลด…</p></main>

  <script src="/js/common.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('slug');
    let game, selected = null;

    function render() {
      document.title = `เติม ${game.name} — Koinz`;
      const servers = game.servers && game.servers.length;
      $('#app').innerHTML = `
        <div class="game-head">
          <span class="icon" style="--c:${esc(game.color)}">${esc(game.icon)}</span>
          <div><h1>เติม ${esc(game.name)}</h1><span class="hint">ซื้อ${esc(game.currency)}เข้าบัญชีเกมด้วย UID</span></div>
        </div>
        <form class="topup" id="form" novalidate>
          <div>
            <section class="step">
              <h2><span class="n">1</span>บัญชีเกมของคุณ</h2>
              <label for="uid">UID / Player ID</label>
              <input id="uid" name="uid" autocomplete="off" inputmode="text" placeholder="เช่น 51234567" required>
              <p class="hint">${esc(game.uidHint || '')}</p>
              ${servers ? `
                <label for="server">เซิร์ฟเวอร์</label>
                <select id="server" required>
                  <option value="">เลือกเซิร์ฟเวอร์</option>
                  ${game.servers.map((s) => `<option>${esc(s)}</option>`).join('')}
                </select>` : ''}
            </section>

            <section class="step">
              <h2><span class="n">2</span>เลือกแพ็กเกจ</h2>
              <div class="packages" role="radiogroup" aria-label="แพ็กเกจ">
                ${game.packages.map((p) => `
                  <button type="button" class="pkg" role="radio" aria-checked="false" data-id="${esc(p.id)}">
                    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ''}
                    <span class="coin">${esc(game.icon)}</span>
                    <span class="name">${esc(p.name)}</span>
                    <span class="price">${baht(p.price)}</span>
                  </button>`).join('')}
              </div>
            </section>

            <section class="step">
              <h2><span class="n">3</span>ช่องทางติดต่อ</h2>
              <label for="contact">เบอร์โทรหรือ LINE ID</label>
              <input id="contact" autocomplete="tel" placeholder="ใช้ติดต่อกลับหากมีปัญหาในการเติม" required>
            </section>
          </div>

          <aside class="summary" aria-live="polite">
            <h2>สรุปรายการ</h2>
            <dl>
              <dt>เกม</dt><dd>${esc(game.name)}</dd>
              <dt>UID</dt><dd id="s-uid">–</dd>
              ${servers ? '<dt>เซิร์ฟเวอร์</dt><dd id="s-server">–</dd>' : ''}
              <dt>แพ็กเกจ</dt><dd id="s-pkg">ยังไม่ได้เลือก</dd>
            </dl>
            <div class="total"><span>ยอดชำระ</span><b id="s-total">฿0</b></div>
            <button class="btn" id="submit" type="submit">สร้างออเดอร์และชำระเงิน</button>
            <p class="error" id="err" role="alert"></p>
            <p class="hint">ชำระด้วย QR PromptPay ผ่านแอปธนาคารได้ทุกธนาคาร</p>
          </aside>
        </form>`;

      $('#uid').addEventListener('input', (e) => ($('#s-uid').textContent = e.target.value || '–'));
      if (servers) $('#server').addEventListener('change', (e) => ($('#s-server').textContent = e.target.value || '–'));

      document.querySelectorAll('.pkg').forEach((btn) =>
        btn.addEventListener('click', () => {
          document.querySelectorAll('.pkg').forEach((b) => b.setAttribute('aria-checked', 'false'));
          btn.setAttribute('aria-checked', 'true');
          selected = game.packages.find((p) => p.id === btn.dataset.id);
          $('#s-pkg').textContent = selected.name;
          $('#s-total').textContent = baht(selected.price);
        })
      );

      $('#form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = $('#err');
        err.textContent = '';
        if (!$('#uid').value.trim()) return (err.textContent = 'กรอก UID ก่อนสร้างออเดอร์'), $('#uid').focus();
        if (servers && !$('#server').value) return (err.textContent = 'เลือกเซิร์ฟเวอร์ก่อนสร้างออเดอร์');
        if (!selected) return (err.textContent = 'เลือกแพ็กเกจก่อนสร้างออเดอร์');
        if (!$('#contact').value.trim()) return (err.textContent = 'กรอกเบอร์โทรหรือ LINE ID ก่อนสร้างออเดอร์'), $('#contact').focus();

        const btn = $('#submit');
        btn.disabled = true;
        btn.textContent = 'กำลังสร้างออเดอร์…';
        try {
          const { id, token } = await api('/api/orders', {
            method: 'POST',
            body: {
              gameSlug: game.slug,
              packageId: selected.id,
              playerId: $('#uid').value,
              server: servers ? $('#server').value : undefined,
              contact: $('#contact').value,
            },
          });
          myOrders.add({ id, token, gameName: game.name, packageName: selected.name });
          location.href = `/order.html?id=${encodeURIComponent(id)}&t=${encodeURIComponent(token)}`;
        } catch (ex) {
          err.textContent = ex.message;
          btn.disabled = false;
          btn.textContent = 'สร้างออเดอร์และชำระเงิน';
        }
      });
    }

    api('/api/games/' + encodeURIComponent(slug || ''))
      .then((g) => { game = g; render(); })
      .catch((e) => ($('#app').innerHTML = `<p class="error">${esc(e.message)}</p><p><a href="/">กลับไปเลือกเกม</a></p>`));
  </script>
</body>
</html>
