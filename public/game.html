<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เติมเกม — Koinz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Mitr:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <a class="logo" href="./"><span class="coin coin-mini">K</span><span data-shop>Koinz</span></a>
      <nav><a href="./#games">เกมทั้งหมด</a><a href="./#mine">ออเดอร์ของฉัน</a></nav>
    </div>
  </header>

  <main class="wrap" id="app"><p class="empty">กำลังโหลด…</p></main>

  <script src="js/config.js"></script>
  <script src="js/common.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('slug');
    let game, cfg = {}, selected = null;
    let idemKey = null; // ใช้ซ้ำเมื่อกดยืนยันใหม่หลังเน็ตหลุด ล้างเมื่อแก้ข้อมูล

    const fieldId = (f) => 'f-' + f.name;

    function fieldHtml(f) {
      const id = esc(fieldId(f));
      const control = f.options
        ? `<select id="${id}" name="${esc(f.name)}" ${f.required ? 'required' : ''}>
             <option value="">เลือก${esc(f.label)}</option>
             ${f.options.map((o) => `<option>${esc(o)}</option>`).join('')}
           </select>`
        : `<input id="${id}" name="${esc(f.name)}" autocomplete="off" maxlength="64"
             inputmode="${esc(f.inputmode || 'text')}" placeholder="${esc(f.placeholder || '')}" ${f.required ? 'required' : ''}>`;
      return `
        <label for="${id}">${esc(f.label)}${f.required ? '' : ' (ไม่บังคับ)'}</label>
        ${control}
        ${f.hint ? `<p class="hint">${esc(f.hint)}</p>` : ''}`;
    }

    // ตรวจฝั่ง client แบบเดียวกับเซิร์ฟเวอร์ → { inputs } หรือ { error, field }
    function readInputs() {
      const inputs = {};
      for (const f of game.fields) {
        const v = $('#' + fieldId(f)).value.trim();
        if (!v) {
          if (f.required) return { error: `${f.options ? 'กรุณาเลือก' : 'กรุณากรอก'}${f.label}`, field: f };
          continue;
        }
        if (/[<>"'`]/.test(v)) return { error: `${f.label}มีอักขระที่ใช้ไม่ได้`, field: f };
        if (f.pattern && !new RegExp(f.pattern).test(v)) return { error: f.patternHint || `${f.label}ไม่ถูกต้อง`, field: f };
        inputs[f.name] = v;
      }
      return { inputs };
    }

    function render() {
      document.title = `เติม ${game.name} — Koinz`;
      $('#app').innerHTML = `
        <div class="game-head">
          <span class="icon" style="--c:${esc(game.color)}">${esc(game.initial)}</span>
          <div><h1>เติม ${esc(game.name)}</h1><span class="hint">ซื้อ${esc(game.currency)}เข้าบัญชีเกมของคุณ</span></div>
        </div>
        <form class="topup" id="form" novalidate>
          <div>
            <section class="step">
              <h2><span class="n">1</span>บัญชีเกมของคุณ</h2>
              ${game.fields.map(fieldHtml).join('')}
              ${cfg.lookupEnabled ? `
                <p><button type="button" class="btn ghost small" id="lookup">ตรวจสอบชื่อในเกม</button></p>
                <p class="hint" id="nickname" aria-live="polite"></p>` : ''}
            </section>

            <section class="step">
              <h2><span class="n">2</span>เลือกแพ็กเกจ</h2>
              <div class="packages" role="radiogroup" aria-label="แพ็กเกจ">
                ${game.packages.map((p) => `
                  <button type="button" class="pkg" role="radio" aria-checked="false" data-id="${esc(p.id)}">
                    ${p.tag ? `<span class="tag">${esc(p.tag)}</span>` : ''}
                    <span class="coin">${esc(game.initial)}</span>
                    <span class="name">${esc(p.name)}</span>
                    <span class="price">${baht(p.price)}</span>
                  </button>`).join('')}
              </div>
            </section>
          </div>

          <aside class="summary" aria-live="polite">
            <h2>สรุปรายการ</h2>
            <dl>
              <dt>เกม</dt><dd>${esc(game.name)}</dd>
              ${game.fields.map((f) => `<dt>${esc(f.label)}</dt><dd id="s-${esc(fieldId(f))}">–</dd>`).join('')}
              <dt>แพ็กเกจ</dt><dd id="s-pkg">ยังไม่ได้เลือก</dd>
            </dl>
            <div class="total"><span>ยอดชำระ</span><b id="s-total">฿0</b></div>
            <button class="btn" id="submit" type="submit">สร้างออเดอร์และชำระเงิน</button>
            <p class="error" id="err" role="alert"></p>
            <p class="hint">ชำระด้วย QR PromptPay ผ่านแอปธนาคารได้ทุกธนาคาร</p>
          </aside>
        </form>`;

      for (const f of game.fields) {
        const el = $('#' + fieldId(f));
        el.addEventListener(f.options ? 'change' : 'input', () => {
          $('#s-' + fieldId(f)).textContent = el.value.trim() || '–';
          idemKey = null;
          if ($('#nickname')) $('#nickname').textContent = '';
        });
        // แสดง patternHint ทันทีเมื่อออกจากช่องแล้วรูปแบบไม่ตรง
        if (f.pattern) el.addEventListener('blur', () => {
          const v = el.value.trim();
          $('#err').textContent = v && !new RegExp(f.pattern).test(v) ? (f.patternHint || `${f.label}ไม่ถูกต้อง`) : '';
        });
      }

      document.querySelectorAll('.pkg').forEach((btn) =>
        btn.addEventListener('click', () => {
          document.querySelectorAll('.pkg').forEach((b) => b.setAttribute('aria-checked', 'false'));
          btn.setAttribute('aria-checked', 'true');
          selected = game.packages.find((p) => p.id === btn.dataset.id);
          idemKey = null;
          $('#s-pkg').textContent = selected.name;
          $('#s-total').textContent = baht(selected.price);
        })
      );

      const lookupBtn = $('#lookup');
      if (lookupBtn) lookupBtn.addEventListener('click', async () => {
        const out = $('#nickname');
        const { inputs, error, field } = readInputs();
        if (error) { out.textContent = error; return $('#' + fieldId(field)).focus(); }
        lookupBtn.disabled = true;
        out.textContent = 'กำลังตรวจสอบ…';
        try {
          const r = await api('/api/player/lookup', { method: 'POST', body: { gameSlug: game.slug, playerInputs: inputs } });
          out.textContent = `ชื่อในเกม: ${r.nickname}${r.mock ? ' (ชื่อจำลองสำหรับทดสอบ)' : ''}`;
        } catch (ex) {
          out.textContent = ex.message;
        } finally {
          lookupBtn.disabled = false;
        }
      });

      $('#form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const err = $('#err');
        err.textContent = '';
        const { inputs, error, field } = readInputs();
        if (error) return (err.textContent = error), $('#' + fieldId(field)).focus();
        if (!selected) return (err.textContent = 'เลือกแพ็กเกจก่อนสร้างออเดอร์');

        idemKey = idemKey || uuid();
        const btn = $('#submit');
        btn.disabled = true;
        btn.textContent = 'กำลังสร้างออเดอร์…';
        try {
          const { id, token } = await api('/api/orders', {
            method: 'POST',
            body: { gameSlug: game.slug, packageId: selected.id, playerInputs: inputs, idempotencyKey: idemKey },
          });
          myOrders.add({ id, token, gameName: game.name, packageName: selected.name });
          location.href = `order.html?id=${encodeURIComponent(id)}&t=${encodeURIComponent(token)}`;
        } catch (ex) {
          err.textContent = ex.message;
          btn.disabled = false;
          btn.textContent = 'สร้างออเดอร์และชำระเงิน';
        }
      });
    }

    Promise.all([api('/api/games/' + encodeURIComponent(slug || '')), shopConfig])
      .then(([g, c]) => { game = g; cfg = c; render(); })
      .catch((e) => ($('#app').innerHTML = `<p class="error">${esc(e.message)}</p><p><a href="./">กลับไปเลือกเกม</a></p>`));
  </script>
</body>
</html>
