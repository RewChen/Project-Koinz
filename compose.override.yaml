# dev — Compose โหลดไฟล์นี้อัตโนมัติเมื่อรัน `docker compose up`
services:
  app:
    build:
      target: dev
    image: koinz-app:dev
    # node --watch ไม่เห็นการแก้ไฟล์จากไดรฟ์ Windows → ใช้ตัว poll ของเราเอง (ไฟล์ใน public/ เห็นผลทันทีอยู่แล้ว)
    command: ["node", "docker/dev-watch.js"]
    environment:
      # npm run test:pg — เทสสร้าง/ลบฐานข้อมูลชั่วคราวผ่าน connection นี้
      TEST_DATABASE_URL: postgres://koinz:${POSTGRES_PASSWORD}@db:5432/postgres
    volumes:
      - ./:/app # แก้โค้ดบนเครื่องแล้วเห็นผลใน container ทันที
      - /app/node_modules # ใช้ node_modules ใน container ไม่ใช่ของเครื่อง
    ports:
      - "3000:3000"

  db:
    ports:
      - "5432:5432" # dev เท่านั้น

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    ports:
      - "8080:8080"
